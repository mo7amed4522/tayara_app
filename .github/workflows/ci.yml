name: Tayara CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Flutter 3.44.9 ships with Dart 3.12.2, satisfying pubspec's `sdk: ^3.12.2`
  # constraint. pinned to a specific patch release for reproducible CI builds.
  FLUTTER_VERSION: "3.44.9"

jobs:
  # ------------------------------------------------------------------
  # Static analysis + formatting check
  # ------------------------------------------------------------------
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from template
        # pubspec.yaml declares .env as an asset, but it is git-ignored so it is
        # absent in a fresh checkout. Without it flutter analyzes with
        # asset_does_not_exist and builds fail to bundle the asset.
        run: cp .env.example .env

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  # ------------------------------------------------------------------
  # Unit and widget tests
  # ------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from template
        run: cp .env.example .env

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage
        env:
          # Prevent the test runner from looking for Firebase on the CI machine.
          FLUTTER_TEST: "true"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  # ------------------------------------------------------------------
  # Android build (debug APK)
  # ------------------------------------------------------------------
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from template
        run: cp .env.example .env

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ------------------------------------------------------------------
  # Android build (release AAB)
  # ------------------------------------------------------------------
  build-android-release:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      # Release builds need the real values; provide them as the ENV_FILE secret
      # and fall back to the template for tag builds without secrets configured.
      - name: Create .env
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
          else
            cp .env.example .env
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build release AAB
        run: |
          flutter build appbundle \
            --release \
            --flavor prod \
            --dart-define=FLAVOR=prod \
            --keystore-path=keystore.jks \
            --store-password=${{ secrets.ANDROID_STORE_PASSWORD }} \
            --target-platform=android-arm,android-arm64

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 7

  # ------------------------------------------------------------------
  # iOS build (debug)
  # ------------------------------------------------------------------
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from template
        run: cp .env.example .env

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Clean stale iOS dependencies
        run: rm -rf ios/Pods ios/Podfile.lock

      - name: Resolve iOS dependencies
        run: pod install --repo-update
        working-directory: ios

      - name: Build iOS (simulator)
        # Simulator builds must be debug — release mode is unsupported.
        run: flutter build ios --no-codesign --simulator

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-debug
          path: build/ios/iphonesimulator/
          retention-days: 7
