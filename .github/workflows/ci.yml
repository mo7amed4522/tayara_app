name: Tayara CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  # Flutter 3.44.9 ships with Dart 3.12.2, satisfying pubspec's `sdk: ^3.12.2`
  # constraint. pinned to a specific patch release for reproducible CI builds.
  FLUTTER_VERSION: "3.44.9"

jobs:
  # ------------------------------------------------------------------
  # Static analysis + formatting check
  # ------------------------------------------------------------------
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  # ------------------------------------------------------------------
  # Unit and widget tests
  # ------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --coverage
        env:
          # Prevent the test runner from looking for Firebase on the CI machine.
          FLUTTER_TEST: "true"

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  # ------------------------------------------------------------------
  # Android build (debug APK)
  # ------------------------------------------------------------------
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ------------------------------------------------------------------
  # Android build (release AAB)
  # ------------------------------------------------------------------
  build-android-release:
    name: Build Android Release
    runs-on: ubuntu-latest
    needs: analyze
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build release AAB
        run: |
          flutter build appbundle \
            --release \
            --flavor prod \
            --dart-define=FLAVOR=prod \
            --keystore-path=keystore.jks \
            --store-password=${{ secrets.ANDROID_STORE_PASSWORD }} \
            --target-platform=android-arm,android-arm64

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: build/app/outputs/bundle/prodRelease/app-prod-release.aab
          retention-days: 7

  # ------------------------------------------------------------------
  # iOS build (debug)
  # ------------------------------------------------------------------
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve iOS dependencies
        run: pod install --repo-update
        working-directory: ios

      - name: Build iOS (simulator)
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --simulator

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-ios-debug
          path: build/ios/iphonesimulator/
          retention-days: 7
